<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2144"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Outer ring glow -->
  <circle cx="256" cy="220" r="168" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.4"/>

  <!-- Main circle -->
  <circle cx="256" cy="220" r="148" fill="url(#circle)" opacity="0.95"/>

  <!-- Inner highlight -->
  <circle cx="216" cy="180" r="48" fill="white" opacity="0.06"/>

  <!-- DS letters -->
  <text x="256" y="272"
        font-size="148"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-weight="900"
        fill="white"
        letter-spacing="-6">DS</text>

  <!-- Bottom label -->
  <text x="256" y="418"
        font-size="40"
        text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-weight="700"
        fill="#42A5F5"
        letter-spacing="7">DERMSCAN</text>
</svg>
